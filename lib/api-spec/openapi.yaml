openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PackageGuard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: environments
    description: Environment management
  - name: packages
    description: Package management
  - name: snapshots
    description: Snapshot management
  - name: history
    description: Update history
  - name: settings
    description: App settings
  - name: dashboard
    description: Dashboard summary

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /environments:
    get:
      operationId: listEnvironments
      tags: [environments]
      summary: List all environments
      responses:
        "200":
          description: List of environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
    post:
      operationId: createEnvironment
      tags: [environments]
      summary: Create a new environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
      responses:
        "201":
          description: Created environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"

  /environments/{id}:
    get:
      operationId: getEnvironment
      tags: [environments]
      summary: Get environment by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "404":
          description: Not found
    delete:
      operationId: deleteEnvironment
      tags: [environments]
      summary: Delete an environment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /environments/{id}/scan:
    post:
      operationId: scanEnvironment
      tags: [environments]
      summary: Scan and refresh packages in an environment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List packages with optional filters
      parameters:
        - name: environmentId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [up-to-date, patch, minor, major, failed, unknown]
        - name: groupName
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"

  /packages/{id}:
    get:
      operationId: getPackage
      tags: [packages]
      summary: Get package by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "404":
          description: Not found
    patch:
      operationId: updatePackageGroup
      tags: [packages]
      summary: Update package group tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageGroupUpdate"
      responses:
        "200":
          description: Updated package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"

  /packages/update:
    post:
      operationId: updatePackages
      tags: [packages]
      summary: Trigger update for one or more packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageUpdateRequest"
      responses:
        "200":
          description: Update job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateJobResult"

  /packages/check-versions:
    post:
      operationId: checkVersions
      tags: [packages]
      summary: Check latest versions for packages in an environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionCheckRequest"
      responses:
        "200":
          description: Version check complete
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"

  /snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      summary: List all snapshots
      parameters:
        - name: environmentId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snapshot"
    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Create a snapshot for an environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotInput"
      responses:
        "201":
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"

  /snapshots/{id}:
    get:
      operationId: getSnapshot
      tags: [snapshots]
      summary: Get snapshot by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404":
          description: Not found
    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Delete a snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /snapshots/{id}/restore:
    post:
      operationId: restoreSnapshot
      tags: [snapshots]
      summary: Restore environment from a snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restore started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"

  /history:
    get:
      operationId: listHistory
      tags: [history]
      summary: Get update history with optional filters
      parameters:
        - name: ecosystem
          in: query
          required: false
          schema:
            type: string
            enum: [pip, npm, conda, venv, nvm]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [success, failed, skipped]
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Update history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get app settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update app settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent update activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"

  /dashboard/status-breakdown:
    get:
      operationId: getStatusBreakdown
      tags: [dashboard]
      summary: Get package count by status per environment
      responses:
        "200":
          description: Status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusBreakdown"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Environment:
      type: object
      required: [id, name, type, path, isActive, packageCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [pip, venv, conda, npm, nvm]
        path:
          type: string
        isActive:
          type: boolean
        packageCount:
          type: integer
        lastScanned:
          type: ["string", "null"]
        createdAt:
          type: string

    EnvironmentInput:
      type: object
      required: [name, type, path]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [pip, venv, conda, npm, nvm]
        path:
          type: string

    ScanResult:
      type: object
      required: [packagesFound, newPackages, updatedPackages]
      properties:
        packagesFound:
          type: integer
        newPackages:
          type: integer
        updatedPackages:
          type: integer

    Package:
      type: object
      required: [id, name, ecosystem, environmentId, installedVersion, status, groupName, lastChecked]
      properties:
        id:
          type: integer
        name:
          type: string
        ecosystem:
          type: string
          enum: [pip, npm, conda, venv, nvm]
        environmentId:
          type: integer
        environmentName:
          type: ["string", "null"]
        installedVersion:
          type: string
        latestVersion:
          type: ["string", "null"]
        status:
          type: string
          enum: [up-to-date, patch, minor, major, failed, unknown]
        groupName:
          type: string
        description:
          type: ["string", "null"]
        homepageUrl:
          type: ["string", "null"]
        lastChecked:
          type: string

    PackageGroupUpdate:
      type: object
      required: [groupName]
      properties:
        groupName:
          type: string

    PackageUpdateRequest:
      type: object
      required: [environmentId, packages]
      properties:
        environmentId:
          type: integer
        packages:
          type: array
          items:
            type: object
            required: [name, targetVersion]
            properties:
              name:
                type: string
              targetVersion:
                type: string

    UpdateJobResult:
      type: object
      required: [jobId, totalPackages, status]
      properties:
        jobId:
          type: string
        totalPackages:
          type: integer
        status:
          type: string

    VersionCheckRequest:
      type: object
      required: [environmentId]
      properties:
        environmentId:
          type: integer

    Snapshot:
      type: object
      required: [id, environmentId, environmentName, name, packageCount, createdAt]
      properties:
        id:
          type: integer
        environmentId:
          type: integer
        environmentName:
          type: string
        name:
          type: string
        packageCount:
          type: integer
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    SnapshotInput:
      type: object
      required: [environmentId, name]
      properties:
        environmentId:
          type: integer
        name:
          type: string
        notes:
          type: string

    RestoreResult:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
        message:
          type: string

    HistoryEntry:
      type: object
      required: [id, packageName, ecosystem, environmentName, fromVersion, toVersion, status, updatedAt]
      properties:
        id:
          type: integer
        packageName:
          type: string
        ecosystem:
          type: string
          enum: [pip, npm, conda, venv, nvm]
        environmentName:
          type: string
        fromVersion:
          type: string
        toVersion:
          type: string
        status:
          type: string
          enum: [success, failed, skipped]
        errorMessage:
          type: ["string", "null"]
        updatedAt:
          type: string

    Settings:
      type: object
      required: [safeMode, cacheDurationHours, concurrencyLimit, autoSnapshotBeforeUpdate, theme]
      properties:
        safeMode:
          type: boolean
        cacheDurationHours:
          type: integer
        concurrencyLimit:
          type: integer
        autoSnapshotBeforeUpdate:
          type: boolean
        theme:
          type: string
          enum: [dark, light, system]
        customScanPaths:
          type: array
          items:
            type: string

    SettingsUpdate:
      type: object
      properties:
        safeMode:
          type: boolean
        cacheDurationHours:
          type: integer
        concurrencyLimit:
          type: integer
        autoSnapshotBeforeUpdate:
          type: boolean
        theme:
          type: string
          enum: [dark, light, system]
        customScanPaths:
          type: array
          items:
            type: string

    DashboardSummary:
      type: object
      required: [totalPackages, totalEnvironments, upToDate, needsUpdate, majorUpdates, minorUpdates, patchUpdates, failedPackages, lastScanAt]
      properties:
        totalPackages:
          type: integer
        totalEnvironments:
          type: integer
        upToDate:
          type: integer
        needsUpdate:
          type: integer
        majorUpdates:
          type: integer
        minorUpdates:
          type: integer
        patchUpdates:
          type: integer
        failedPackages:
          type: integer
        lastScanAt:
          type: ["string", "null"]

    StatusBreakdown:
      type: object
      required: [environmentId, environmentName, upToDate, patch, minor, major, failed, unknown]
      properties:
        environmentId:
          type: integer
        environmentName:
          type: string
        upToDate:
          type: integer
        patch:
          type: integer
        minor:
          type: integer
        major:
          type: integer
        failed:
          type: integer
        unknown:
          type: integer
