  react: 19.1.0
  react-dom: 19.1.0
  semver: ^7.8.0
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.9.0
  zod: ^3.25.76

